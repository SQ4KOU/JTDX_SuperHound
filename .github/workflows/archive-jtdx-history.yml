name: Archive historical JTDX work

on:
  push:
    branches: [main]
    paths: ['.github/workflows/archive-jtdx-history.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy historical JTDX-only artifacts
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/SQ4KOU/SQ4KOU-THETIS.git /tmp/source

          git -C /tmp/source checkout --detach 9390011f05925dc5fac11c17c0c3357204a0d84e
          rm -rf history/jtdx-final-build
          mkdir -p history/jtdx-final-build/workflows
          cp -a /tmp/source/jtdx-final history/jtdx-final-build/
          cp -a /tmp/source/.github/workflows/jtdx-final-build.yml history/jtdx-final-build/workflows/
          test "$(git -C /tmp/source rev-parse HEAD)" = "9390011f05925dc5fac11c17c0c3357204a0d84e"
          test "$(git -C /tmp/source rev-parse HEAD:jtdx-final)" = "8217dfc57b7c02db5f8c72f9ba4eaae722ab5c37"

          git -C /tmp/source checkout --detach e23e709e25f8d37fa4d6eecedea03502fba7c3e4
          rm -rf history/jtdx-superhound-p1-ci
          mkdir -p history/jtdx-superhound-p1-ci/workflows
          cp -a /tmp/source/.github/workflows/jtdx-superhound-p1.yml history/jtdx-superhound-p1-ci/workflows/
          test "$(git -C /tmp/source rev-parse HEAD)" = "e23e709e25f8d37fa4d6eecedea03502fba7c3e4"

          cat > history/README.md <<'EOF'
          # Historical JTDX work

          This directory preserves JTDX/SuperHound artifacts that existed on earlier dedicated branches but were superseded by the current FINAL baseline.

          - `jtdx-final-build`: source branch HEAD `9390011f05925dc5fac11c17c0c3357204a0d84e`; archived `jtdx-final` tree SHA `8217dfc57b7c02db5f8c72f9ba4eaae722ab5c37` plus its historical JTDX build workflow.
          - `jtdx-superhound-p1-ci`: source branch HEAD `e23e709e25f8d37fa4d6eecedea03502fba7c3e4`; archived Phase P1 JTDX/SuperHound validation workflow.
          - `jtdx-final-build-2`: source branch HEAD `b59f2071193de0a8ffdd53710dbdeacb98884ab4`; its final JTDX trees are identical to the active migrated baseline, so they are not duplicated under `history/`.

          The complete Thetis trees from those branches are intentionally excluded because they are unrelated to JTDX.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history
          git commit -m "Archive superseded JTDX development artifacts"
          git push origin HEAD:main

          test "$(git rev-parse HEAD:history/jtdx-final-build/jtdx-final)" = "8217dfc57b7c02db5f8c72f9ba4eaae722ab5c37"
          test "$(git hash-object history/jtdx-final-build/workflows/jtdx-final-build.yml)" = "19597420311949dcac0d727b731143c92fc43f50"
          test "$(git hash-object history/jtdx-superhound-p1-ci/workflows/jtdx-superhound-p1.yml)" = "25e5f13585cc269004afbc1af468a4ec72e35300"
          echo HISTORY_ARCHIVE_VERIFY=PASS
