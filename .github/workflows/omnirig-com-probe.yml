name: OmniRig COM x64 probe

on:
  push:
    branches: [main]
    paths: ['.github/workflows/omnirig-com-probe.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-2022
    steps:
      - name: Install and probe OmniRig
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $zip=Join-Path $env:RUNNER_TEMP 'OmniRig.zip'
          $dir=Join-Path $env:RUNNER_TEMP 'OmniRig'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://www.dxatlas.com/OmniRig/Files/OmniRig.zip' -OutFile $zip
          if((Get-FileHash $zip -Algorithm SHA256).Hash -ne '46654EC3BA2FE9FF23A21EDAA657C46E0E9867B62B254968A3C4436DD81531A8'){throw 'SHA mismatch'}
          Expand-Archive $zip $dir -Force
          $p=Start-Process "$dir\OmniRigSetup.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru
          if($p.ExitCode -ne 0){throw "installer $($p.ExitCode)"}
          $exe='C:\Program Files (x86)\Afreet\OmniRig\OmniRig.exe'
          Write-Host "OMNIRIG_EXE_EXISTS=$(Test-Path $exe)"
          if(Test-Path $exe){Write-Host "OMNIRIG_EXE=$exe"; Write-Host "OMNIRIG_EXE_SHA256=$((Get-FileHash $exe -Algorithm SHA256).Hash)"}
          Write-Host '=== 64-bit PowerShell COM activation ==='
          try {
            $o=New-Object -ComObject 'OmniRig.OmniRigX'
            Write-Host "COM64_TYPE=$($o.GetType().FullName)"
            Write-Host 'OMNIRIG_COM64=PASS'
            [Runtime.InteropServices.Marshal]::FinalReleaseComObject($o) | Out-Null
          } catch {
            Write-Host "OMNIRIG_COM64=FAIL $($_.Exception.Message)"
          }
          Write-Host '=== registry ==='
          foreach($k in @(
            'Registry::HKEY_CLASSES_ROOT\OmniRig.OmniRigX',
            'Registry::HKEY_CLASSES_ROOT\WOW6432Node\CLSID\{0839E8C6-ED30-4950-8087-966F970F0CAE}',
            'Registry::HKEY_CLASSES_ROOT\CLSID\{0839E8C6-ED30-4950-8087-966F970F0CAE}',
            'Registry::HKEY_CLASSES_ROOT\TypeLib\{4FE359C5-A58F-459D-BE95-CA559FB4F270}',
            'Registry::HKEY_CLASSES_ROOT\WOW6432Node\TypeLib\{4FE359C5-A58F-459D-BE95-CA559FB4F270}'
          )) {
            Write-Host "KEY $k EXISTS=$(Test-Path $k)"
            if(Test-Path $k){Get-ChildItem $k -Recurse -ErrorAction SilentlyContinue | Select-Object -First 20 | ForEach-Object { Write-Host $_.Name }}
          }
