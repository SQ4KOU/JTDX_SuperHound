name: OmniRig FINAL audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/omnirig-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct verified FINAL bundle
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir="$env:GITHUB_WORKSPACE\jtdx-final"
          function Read-Part([string[]]$names) {
            $s=''
            foreach($name in $names) {
              $p=Join-Path $dir $name
              if(-not (Test-Path $p)){throw "Missing fragment $p"}
              $s += [IO.File]::ReadAllText($p).Trim()
            }
            return $s
          }
          $b64=''
          for($i=0;$i -lt 14;$i++) {
            if($i -eq 6){$part=Read-Part @('fix06.0.0','fix06.0.1.0','fix06.0.1.1','fix06.1','fix06.2','fix06.3')}
            elseif($i -eq 7){$part=Read-Part @('fix07.0','fix07.1','fix07.2','fix07.3.0','fix07.3.1')}
            elseif($i -eq 12){$part=Read-Part @('fix12.0','fix12.1','fix12.2','fix12.3')}
            else{$part=Read-Part @(("bundle.part{0:D2}" -f $i))}
            $expected=if($i -eq 13){704}else{8000}
            if($part.Length -ne $expected){throw "Part $i length $($part.Length), expected $expected"}
            $b64 += $part
          }
          if($b64.Length -ne 104704){throw "Combined Base64 length $($b64.Length)"}
          $zip="$env:RUNNER_TEMP\JTDX_SUPERHOUND_MSI_FINAL.zip"
          [IO.File]::WriteAllBytes($zip,[Convert]::FromBase64String($b64))
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if($hash -ne 'c7bafdd622a46dac7730f477b46daf69f821a4b2edc70e27345036e842a1b354'){throw 'FINAL bundle SHA mismatch'}
          $dst="$env:RUNNER_TEMP\jtdx-audit"
          Expand-Archive $zip $dst -Force
          $root="$dst\JTDX_SUPERHOUND_MSI_FINAL"
          "FINAL_ROOT=$root" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Inspect OmniRig and source-build handling
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Write-Host '=== BUNDLE FILES ==='
          Get-ChildItem "$env:FINAL_ROOT" -Recurse | ForEach-Object { Write-Host $_.FullName }
          Write-Host '=== PATCH OMNIRIG/CMAKE/TRANSCEIVER REFERENCES ==='
          Select-String -Path "$env:FINAL_ROOT\patch_superhound.py" -Pattern 'OmniRig|CMakeLists|TransceiverFactory|Configuration|ActiveQt|dumpcpp|QT5' -Context 4,6 | ForEach-Object { $_.ToString() }
          Write-Host '=== BUILDER OMNIRIG/SOURCE REFERENCES ==='
          Select-String -Path "$env:FINAL_ROOT\BUILD_JTDX_SUPERHOUND_MSI.ps1" -Pattern 'OmniRig|jtdx|source|download|clone|CMake|ActiveQt|dumpcpp|QT5' -Context 4,6 | ForEach-Object { $_.ToString() }
          Write-Host '=== PATCH SUPERHOUND HEAD ==='
          Get-Content "$env:FINAL_ROOT\patch_superhound.py" -TotalCount 260
