name: Migrate JTDX project from SQ4KOU-THETIS

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/migrate-jtdx-from-thetis.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Migrate JTDX files and final release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPO: SQ4KOU/SQ4KOU-THETIS
          SOURCE_COMMIT: c748b98f1ba51314c5a592622adc6bef3f6179c2
          RELEASE_TAG: jtdx-superhound-2.2.159-bandsafe-2026-09-09
        run: |
          set -euo pipefail
          git clone --filter=blob:none "https://github.com/${SOURCE_REPO}.git" /tmp/source
          git -C /tmp/source checkout --detach "$SOURCE_COMMIT"
          test "$(git -C /tmp/source rev-parse HEAD)" = "$SOURCE_COMMIT"

          rm -rf jtdx-final jtdx-final-corrections jtdx-final-payload
          cp -a /tmp/source/jtdx-final ./
          cp -a /tmp/source/jtdx-final-corrections ./
          cp -a /tmp/source/jtdx-final-payload ./

          while IFS= read -r rel; do
            case "$rel" in
              .github/workflows/*|jtdx-final/*|jtdx-final-corrections/*|jtdx-final-payload/*) continue ;;
            esac
            low="$(printf '%s' "$rel" | tr '[:upper:]' '[:lower:]')"
            if [[ "$low" == *jtdx* || "$low" == *superhound* ]]; then
              mkdir -p "$(dirname "$rel")"
              cp -a "/tmp/source/$rel" "$rel"
            fi
          done < <(git -C /tmp/source ls-tree -r --name-only "$SOURCE_COMMIT")

          cat > MIGRATION.md <<'EOF'
          # JTDX / SuperHound migration provenance

          Migrated from `SQ4KOU/SQ4KOU-THETIS`.

          Final verified source/build commit: `c748b98f1ba51314c5a592622adc6bef3f6179c2`.
          Final release tag: `jtdx-superhound-2.2.159-bandsafe-2026-09-09`.
          Final MSI SHA-256: `30c1647993e8f2ca99b2e29ed34a37da1ae6f24fdc1d64f9a08651b3d2031d45`.

          Previous JTDX working refs:
          - `jtdx-final-build` -> `b59e866de5dafdb8c380bebb11b1a41cf665785f`
          - `jtdx-final-build-2` -> `0cc998aa51abd3943193e8a66a35fa3f6c2b40cd`
          - `jtdx-superhound-p1-ci` -> `db20b49f8a2131aaf64e959410f98fe8f4c28f95`

          Unrelated Thetis/ESP32/Red Pitaya content was deliberately excluded.
          EOF

          cat > README.md <<'EOF'
          # JTDX_SuperHound

          Dedicated SQ4KOU repository for JTDX / Super Hound development.

          Current baseline: **JTDX 2.2.159 — FINAL TCI BANDSAFE**.

          Contains the complete migrated JTDX working payloads, correction payloads, overlay/build scripts and JTDX-specific GitHub Actions workflows. The final Windows x64 MSI and checksum are published under Releases.

          See `MIGRATION.md` for provenance.
          EOF

          for d in jtdx-final jtdx-final-corrections jtdx-final-payload; do
            diff -qr "/tmp/source/$d" "$d"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md MIGRATION.md jtdx-final jtdx-final-corrections jtdx-final-payload
          git add -A -- ':!.github/workflows'
          git commit -m "Migrate JTDX SuperHound project payload from SQ4KOU-THETIS"
          git push origin HEAD:main

          mkdir -p /tmp/release
          curl -fL --retry 3 -o /tmp/release/JTDX-SuperHound-2.2.159-FINAL-TCI-BANDSAFE-win64.msi "https://github.com/${SOURCE_REPO}/releases/download/${RELEASE_TAG}/JTDX-SuperHound-2.2.159-FINAL-TCI-BANDSAFE-win64.msi"
          curl -fL --retry 3 -o /tmp/release/SHA256SUMS-JTDX-BANDSAFE.txt "https://github.com/${SOURCE_REPO}/releases/download/${RELEASE_TAG}/SHA256SUMS-JTDX-BANDSAFE.txt"
          echo "30c1647993e8f2ca99b2e29ed34a37da1ae6f24fdc1d64f9a08651b3d2031d45  /tmp/release/JTDX-SuperHound-2.2.159-FINAL-TCI-BANDSAFE-win64.msi" | sha256sum -c -

          cat > /tmp/release-notes.md <<'EOF'
          ## JTDX SuperHound 2.2.159 — FINAL TCI BANDSAFE

          Verified Windows x64 build based on JTDX 2.2.159 with SQ4KOU SuperHound/FT2 integration, integrated monitor, TCI watchdog/reconnect, fail-safe TX handling, BANDSAFE hardening and JT9 shutdown fix.

          Original source/build commit: `c748b98f1ba51314c5a592622adc6bef3f6179c2`.
          Original successful build run: `34385192471`.
          MSI size: `45053934` bytes.
          MSI SHA-256: `30c1647993e8f2ca99b2e29ed34a37da1ae6f24fdc1d64f9a08651b3d2031d45`.
          EOF

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" /tmp/release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" /tmp/release/* --repo "$GITHUB_REPOSITORY" --target main --title "JTDX SuperHound 2.2.159 — FINAL TCI BANDSAFE" --notes-file /tmp/release-notes.md
          fi
