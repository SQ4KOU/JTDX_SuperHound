name: JTDX FINAL Windows Build FIXED2

on:
  push:
    branches:
      - jtdx-final-build-2
    paths:
      - '.github/workflows/jtdx-final-build-fixed2.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reconstruct and verify FINAL bundle
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = "$env:GITHUB_WORKSPACE\jtdx-final"
          function Read-Part([string[]]$names) {
            $s = ''
            foreach ($name in $names) {
              $p = Join-Path $dir $name
              if (-not (Test-Path $p)) { throw "Missing bundle fragment: $p" }
              $s += [IO.File]::ReadAllText($p).Trim()
            }
            return $s
          }
          $b64 = ''
          for ($i = 0; $i -lt 14; $i++) {
            if ($i -eq 6) {
              $part = Read-Part @('fix06.0.0','fix06.0.1.0','fix06.0.1.1','fix06.1','fix06.2','fix06.3')
            } elseif ($i -eq 7) {
              $part = Read-Part @('fix07.0','fix07.1','fix07.2','fix07.3.0','fix07.3.1')
            } elseif ($i -eq 12) {
              $part = Read-Part @('fix12.0','fix12.1','fix12.2','fix12.3')
            } else {
              $part = Read-Part @(("bundle.part{0:D2}" -f $i))
            }
            $expectedLen = if ($i -eq 13) { 704 } else { 8000 }
            if ($part.Length -ne $expectedLen) { throw "Part $i length mismatch: $($part.Length), expected $expectedLen" }
            $b64 += $part
          }
          if ($b64.Length -ne 104704) { throw "Combined Base64 length mismatch: $($b64.Length)" }
          $zip = "$env:RUNNER_TEMP\JTDX_SUPERHOUND_MSI_FINAL.zip"
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Write-Host "BUNDLE_SHA256=$hash"
          if ($hash -ne 'c7bafdd622a46dac7730f477b46daf69f821a4b2edc70e27345036e842a1b354') { throw "Bundle SHA256 mismatch: $hash" }
          $dst = "$env:RUNNER_TEMP\jtdx-final"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dst -Force
          $root = "$dst\JTDX_SUPERHOUND_MSI_FINAL"
          if (-not (Test-Path "$root\BUILD_JTDX_SUPERHOUND_MSI.ps1")) { throw 'FINAL build script missing' }
          Write-Host "FINAL_ROOT=$root"

      - name: Setup complete MSYS2 MINGW64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          location: C:\msys64
          update: true
          cache: false
          install: >-
            git
            make
            patch
            pkgconf
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-fortran
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-activeqt
            mingw-w64-x86_64-qt5-multimedia
            mingw-w64-x86_64-qt5-serialport
            mingw-w64-x86_64-qt5-tools
            mingw-w64-x86_64-qt5-websockets

      - name: Verify toolchain before builder
        shell: msys2 {0}
        run: |
          set -e
          test -f /mingw64/lib/cmake/Qt5/Qt5Config.cmake
          test -f /mingw64/include/boost/version.hpp
          echo "QT5_CONFIG=PASS"
          echo "BOOST_HEADERS=PASS"

      - name: Patch only builder dependency timeout
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "$env:RUNNER_TEMP\jtdx-final\JTDX_SUPERHOUND_MSI_FINAL"
          $path = "$root\BUILD_JTDX_SUPERHOUND_MSI.ps1"
          $lines = [System.Collections.Generic.List[string]](Get-Content $path)
          $needleIndex = -1
          for ($i=0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match 'Run\s*\{\s*&\s*\$TimeoutExe\s+@pacmanArgs\s*\}') { $needleIndex = $i; break }
          }
          if ($needleIndex -lt 0) { throw 'pacman timeout invocation not found in FINAL builder' }
          $start = [Math]::Max(0, $needleIndex - 40)
          $end = [Math]::Min($lines.Count - 1, $needleIndex + 5)
          $timeoutIndexes = @()
          for ($i=$start; $i -le $end; $i++) {
            if ($lines[$i] -match '(?<!\d)180(?<suffix>s?)(?!\d)') { $timeoutIndexes += $i }
          }
          if ($timeoutIndexes.Count -ne 1) { throw "Expected exactly one 180[s] timeout near pacman invocation; found $($timeoutIndexes.Count)" }
          $m = $timeoutIndexes[0]
          $before = $lines[$m]
          $lines[$m] = [regex]::Replace($lines[$m], '(?<!\d)180(?<suffix>s?)(?!\d)', '1800${suffix}', 1)
          Set-Content -Path $path -Value $lines -Encoding UTF8
          Write-Host "BUILDER_TIMEOUT_PATCH=PASS line=$($m+1)"
          Write-Host "BEFORE=$before"
          Write-Host "AFTER=$($lines[$m])"

      - name: Export CMake dependency paths
        shell: powershell
        run: |
          "CMAKE_PREFIX_PATH=C:\msys64\mingw64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Qt5_DIR=C:\msys64\mingw64\lib\cmake\Qt5" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build JTDX SuperHound FINAL MSI
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $root = "$env:RUNNER_TEMP\jtdx-final\JTDX_SUPERHOUND_MSI_FINAL"
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$root\BUILD_JTDX_SUPERHOUND_MSI.ps1"
          $code = $LASTEXITCODE
          Write-Host "FINAL_BUILDER_EXIT=$code"
          if ($code -ne 0) { exit $code }

      - name: Dump builder logs on failure
        if: failure()
        shell: powershell
        run: |
          $root = "$env:RUNNER_TEMP\jtdx-final\JTDX_SUPERHOUND_MSI_FINAL"
          if (Test-Path "$root\LOGS") {
            Get-ChildItem "$root\LOGS\*.log" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | ForEach-Object {
              Write-Host "===== LOG: $($_.FullName) ====="
              Get-Content $_.FullName -Tail 700 -ErrorAction SilentlyContinue
            }
          }

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JTDX-SuperHound-FINAL-DIAGNOSTICS-FIXED2
          path: |
            ${{ runner.temp }}\jtdx-final\JTDX_SUPERHOUND_MSI_FINAL\LOGS\*.log
            ${{ runner.temp }}\jtdx-final\JTDX_SUPERHOUND_MSI_FINAL\OUTPUT\*.txt
          if-no-files-found: warn

      - name: Validate FINAL MSI
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = "$env:RUNNER_TEMP\jtdx-final\JTDX_SUPERHOUND_MSI_FINAL"
          $msi = Get-ChildItem "$root\OUTPUT\JTDX-SuperHound*.msi" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $msi) { throw 'FINAL MSI not found' }
          if ($msi.Length -lt 1000000) { throw "FINAL MSI too small: $($msi.Length) bytes" }
          $hash = (Get-FileHash $msi.FullName -Algorithm SHA256).Hash.ToLower()
          Write-Host "FINAL_MSI=$($msi.Name)"
          Write-Host "FINAL_MSI_SIZE=$($msi.Length)"
          Write-Host "FINAL_MSI_SHA256=$hash"
          @(
            "FINAL_MSI=$($msi.Name)",
            "FINAL_MSI_SIZE=$($msi.Length)",
            "FINAL_MSI_SHA256=$hash"
          ) | Set-Content "$root\OUTPUT\FINAL_BUILD_INFO.txt" -Encoding UTF8

      - name: Upload FINAL artifact
        uses: actions/upload-artifact@v4
        with:
          name: JTDX-SuperHound-FINAL
          path: |
            ${{ runner.temp }}\jtdx-final\JTDX_SUPERHOUND_MSI_FINAL\OUTPUT\*.msi
            ${{ runner.temp }}\jtdx-final\JTDX_SUPERHOUND_MSI_FINAL\OUTPUT\FINAL_BUILD_INFO.txt
            ${{ runner.temp }}\jtdx-final\JTDX_SUPERHOUND_MSI_FINAL\LOGS\*.log
          if-no-files-found: error
