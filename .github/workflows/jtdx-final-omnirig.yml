name: JTDX FINAL TCI BANDSAFE OMNIRIG

on:
  push:
    branches: [main]
    paths:
      - 'jtdx-final/apply_omnirig_overlay.py'
      - '.github/workflows/jtdx-final-omnirig.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct verified FINAL bundle
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dir="$env:GITHUB_WORKSPACE\jtdx-final"
          function Read-Part([string[]]$names) {
            $s=''
            foreach($name in $names) {
              $p=Join-Path $dir $name
              if(-not (Test-Path $p)){throw "Missing fragment $p"}
              $s += [IO.File]::ReadAllText($p).Trim()
            }
            return $s
          }
          $b64=''
          for($i=0;$i -lt 14;$i++) {
            if($i -eq 6){$part=Read-Part @('fix06.0.0','fix06.0.1.0','fix06.0.1.1','fix06.1','fix06.2','fix06.3')}
            elseif($i -eq 7){$part=Read-Part @('fix07.0','fix07.1','fix07.2','fix07.3.0','fix07.3.1')}
            elseif($i -eq 12){$part=Read-Part @('fix12.0','fix12.1','fix12.2','fix12.3')}
            else{$part=Read-Part @(("bundle.part{0:D2}" -f $i))}
            $expected=if($i -eq 13){704}else{8000}
            if($part.Length -ne $expected){throw "Part $i length $($part.Length), expected $expected"}
            $b64 += $part
          }
          if($b64.Length -ne 104704){throw "Combined Base64 length $($b64.Length)"}
          $zip="$env:RUNNER_TEMP\JTDX_SUPERHOUND_MSI_FINAL.zip"
          [IO.File]::WriteAllBytes($zip,[Convert]::FromBase64String($b64))
          $hash=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Write-Host "BUNDLE_SHA256=$hash"
          if($hash -ne 'c7bafdd622a46dac7730f477b46daf69f821a4b2edc70e27345036e842a1b354'){throw 'FINAL bundle SHA mismatch'}
          $dst="$env:RUNNER_TEMP\jtdx-omnirig"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          Expand-Archive $zip $dst -Force
          $root="$dst\JTDX_SUPERHOUND_MSI_FINAL"
          if(-not (Test-Path "$root\BUILD_JTDX_SUPERHOUND_MSI.ps1")){throw 'Builder missing'}
          "FINAL_ROOT=$root" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Apply FINAL BANDSAFE and OmniRig overlays
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          python "$env:GITHUB_WORKSPACE\jtdx-final\apply_tci_bandfix_overlay.py" "$env:FINAL_ROOT"
          python "$env:GITHUB_WORKSPACE\jtdx-final\apply_jt9_shutdown_fix_overlay.py" "$env:FINAL_ROOT"
          python "$env:GITHUB_WORKSPACE\jtdx-final\apply_tci_bandsafe_overlay.py" "$env:FINAL_ROOT"
          python "$env:GITHUB_WORKSPACE\jtdx-final\apply_omnirig_overlay.py" "$env:FINAL_ROOT"
          python -m py_compile "$env:FINAL_ROOT\patch_superhound.py"
          python -m py_compile "$env:GITHUB_WORKSPACE\jtdx-final\apply_omnirig_overlay.py"
          $builder="$env:FINAL_ROOT\BUILD_JTDX_SUPERHOUND_MSI.ps1"
          $patcher="$env:FINAL_ROOT\patch_superhound.py"
          $text=[IO.File]::ReadAllText($builder)
          $old="'--foreground','--signal=TERM','180s',"
          $new="'--foreground','--signal=TERM','1800s',"
          if(-not $text.Contains($old)){throw 'Dependency timeout anchor missing'}
          $text=$text.Replace($old,$new)
          [IO.File]::WriteAllText($builder,$text)
          foreach($needle in @(
            '-DJTDX_ENABLE_OMNIRIG=ON',
            '-DJTDX_OMNIRIG_SERVER="$OMNIRIG_SERVER_WIN"',
            'lrelease-qt5 dumpcpp',
            '[PASS] OmniRig ActiveQt server file:',
            '[PASS] OmniRig ActiveQt wrapper generation gate',
            "MSI_VERSION='2.2.177'",
            "MSI_NAME='JTDX-SuperHound-2.2.159-FINAL-TCI-BANDSAFE-OMNIRIG-win64'"
          )) {
            if(-not (Select-String -Path $builder -SimpleMatch $needle -Quiet)){throw "Missing OmniRig builder gate: $needle"}
          }
          foreach($needle in @('JTDX_OMNIRIG_SERVER','CMake deterministic OmniRig ActiveQt server path')) {
            if(-not (Select-String -Path $patcher -SimpleMatch $needle -Quiet)){throw "Missing OmniRig source patch gate: $needle"}
          }
          Write-Host 'OMNIRIG_OVERLAY=PASS'

      - name: Install and verify official OmniRig runtime
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $zip=Join-Path $env:RUNNER_TEMP 'OmniRig-1.20.zip'
          $dir=Join-Path $env:RUNNER_TEMP 'OmniRig-1.20'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://www.dxatlas.com/OmniRig/Files/OmniRig.zip' -OutFile $zip
          $sha=(Get-FileHash $zip -Algorithm SHA256).Hash.ToUpperInvariant()
          Write-Host "OMNIRIG_ZIP_SHA256=$sha"
          if($sha -ne '46654EC3BA2FE9FF23A21EDAA657C46E0E9867B62B254968A3C4436DD81531A8') {
            throw 'Official OmniRig 1.20 package SHA-256 mismatch'
          }
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $setup=Join-Path $dir 'OmniRigSetup.exe'
          if(-not (Test-Path $setup)){throw 'OmniRigSetup.exe missing from official package'}
          $p=Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru
          if($p.ExitCode -ne 0){throw "OmniRig installer exit code $($p.ExitCode)"}
          $server='C:\Program Files (x86)\Afreet\OmniRig\OmniRig.exe'
          if(-not (Test-Path $server)){$server='C:\Program Files\Afreet\OmniRig\OmniRig.exe'}
          if(-not (Test-Path $server)){throw 'Installed OmniRig.exe not found'}
          Write-Host "OMNIRIG_SERVER=$server"
          Write-Host "OMNIRIG_SERVER_SHA256=$((Get-FileHash $server -Algorithm SHA256).Hash)"
          $omni=$null
          try {
            $omni=New-Object -ComObject 'OmniRig.OmniRigX'
            if($null -eq $omni){throw 'COM activation returned null'}
            Write-Host "OMNIRIG_COM_TYPE=$($omni.GetType().FullName)"
            Write-Host 'OMNIRIG_COM64=PASS'
          } finally {
            if($null -ne $omni){[Runtime.InteropServices.Marshal]::FinalReleaseComObject($omni) | Out-Null}
          }
          "SH_OMNIRIG_SERVER_WIN=$server" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'OMNIRIG_RUNTIME_INSTALL=PASS'

      - name: Setup MSYS2 MINGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          location: C:\msys64
          update: true
          cache: false
          install: >-
            git
            make
            patch
            pkgconf
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-fortran
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-activeqt
            mingw-w64-x86_64-qt5-multimedia
            mingw-w64-x86_64-qt5-serialport
            mingw-w64-x86_64-qt5-tools
            mingw-w64-x86_64-qt5-websockets

      - name: Verify direct ActiveQt wrapper generation
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $dumpcpp='C:\msys64\mingw64\bin\dumpcpp.exe'
          if(-not (Test-Path $dumpcpp)) {
            Write-Host 'ActiveQt bin directory:'
            Get-ChildItem 'C:\msys64\mingw64\bin' -Filter '*dump*' | ForEach-Object { Write-Host $_.FullName }
            throw "dumpcpp.exe missing: $dumpcpp"
          }
          if(-not (Test-Path $env:SH_OMNIRIG_SERVER_WIN)){throw "OmniRig server missing: $env:SH_OMNIRIG_SERVER_WIN"}
          $tmp=Join-Path $env:RUNNER_TEMP 'omnirig-dumpcpp-direct'
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          $out=Join-Path $tmp 'OmniRig'
          Write-Host "DUMPCPP=$dumpcpp"
          Write-Host "DUMPCPP_INPUT=$env:SH_OMNIRIG_SERVER_WIN"
          & $dumpcpp -o $out $env:SH_OMNIRIG_SERVER_WIN
          if($LASTEXITCODE -ne 0){throw "dumpcpp exit code $LASTEXITCODE"}
          $h="$out.h"
          $c="$out.cpp"
          if(-not (Test-Path $h)){throw "Generated OmniRig.h missing: $h"}
          if(-not (Test-Path $c)){throw "Generated OmniRig.cpp missing: $c"}
          if((Get-Item $h).Length -eq 0 -or (Get-Item $c).Length -eq 0){throw 'Generated OmniRig wrapper is empty'}
          if(-not (Select-String -Path $h -SimpleMatch 'OmniRigX' -Quiet)){throw 'Generated header does not contain OmniRigX'}
          Write-Host "OMNIRIG_DUMPCPP_HEADER_SIZE=$((Get-Item $h).Length)"
          Write-Host "OMNIRIG_DUMPCPP_SOURCE_SIZE=$((Get-Item $c).Length)"
          Write-Host 'OMNIRIG_DUMPCPP_DIRECT=PASS'

      - name: Export CMake paths
        shell: powershell
        run: |
          "CMAKE_PREFIX_PATH=C:\msys64\mingw64" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "Qt5_DIR=C:\msys64\mingw64\lib\cmake\Qt5" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build JTDX FINAL OmniRig MSI
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:FINAL_ROOT\BUILD_JTDX_SUPERHOUND_MSI.ps1"
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}

      - name: Audit compiled OmniRig and BANDSAFE source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $src="$env:FINAL_ROOT\WORK\jtdx"
          $tci="$src\TCITransceiver.cpp"
          $tf="$src\TransceiverFactory.cpp"
          $omni="$src\OmniRigTransceiver.cpp"
          $cache="$src\build-superhound\CMakeCache.txt"
          $ninja="$src\build-superhound\build.ninja"
          foreach($p in @($tci,$tf,$omni,$cache,$ninja)){if(-not (Test-Path $p)){throw "Missing audit file: $p"}}
          foreach($needle in @('OmniRigTransceiver::register_transceivers','new OmniRigTransceiver','defined (JTDX_ENABLE_OMNIRIG)')) {
            if(-not (Select-String -Path $tf -SimpleMatch $needle -Quiet)){throw "Missing TransceiverFactory OmniRig gate: $needle"}
          }
          foreach($needle in @('Failed to start OmniRig COM server','OmniRig::OmniRigX','SetTx','GetRxFrequency')) {
            if(-not (Select-String -Path $omni -SimpleMatch $needle -Quiet)){throw "Missing OmniRig backend gate: $needle"}
          }
          if(-not (Select-String -Path $cache -SimpleMatch 'JTDX_ENABLE_OMNIRIG:BOOL=ON' -Quiet)){throw 'OmniRig CMake cache is not ON'}
          if(-not (Select-String -Path $cache -SimpleMatch 'JTDX_OMNIRIG_SERVER:FILEPATH=' -Quiet)){throw 'OmniRig explicit server path missing from cache'}
          if(-not (Select-String -Path $ninja -SimpleMatch 'OmniRigTransceiver.cpp' -Quiet)){throw 'OmniRig source absent from Ninja graph'}
          if(-not (Select-String -Path $ninja -SimpleMatch 'JTDX_ENABLE_OMNIRIG' -Quiet)){throw 'OmniRig compile definition absent from Ninja graph'}
          $genH=Get-ChildItem "$src\build-superhound" -Recurse -Filter OmniRig.h | Select-Object -First 1
          $genC=Get-ChildItem "$src\build-superhound" -Recurse -Filter OmniRig.cpp | Select-Object -First 1
          if(-not $genH){throw 'Generated OmniRig.h missing'}
          if(-not $genC){throw 'Generated OmniRig.cpp missing'}
          foreach($needle in @('err_index >= 0 && err_index < errortable.size()','band_change = !HPSDR &&','bool const rx_superseded','bool const tx_superseded')) {
            if(-not (Select-String -Path $tci -SimpleMatch $needle -Quiet)){throw "Missing retained BANDSAFE gate: $needle"}
          }
          Write-Host "OMNIRIG_GENERATED_HEADER=$($genH.FullName)"
          Write-Host "OMNIRIG_GENERATED_SOURCE=$($genC.FullName)"
          Write-Host 'OMNIRIG_SOURCE_BUILD_AUDIT=PASS'
          Write-Host 'TCI_BANDSAFE_RETENTION_AUDIT=PASS'

      - name: Validate MSI
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $msi=Get-ChildItem "$env:FINAL_ROOT\OUTPUT\JTDX-SuperHound-2.2.159-FINAL-TCI-BANDSAFE-OMNIRIG-win64.msi" | Select-Object -First 1
          if(-not $msi){throw 'OmniRig MSI missing'}
          if($msi.Length -lt 1000000){throw "MSI too small: $($msi.Length)"}
          $sha=(Get-FileHash $msi.FullName -Algorithm SHA256).Hash.ToLower()
          @(
            "FINAL_MSI=$($msi.Name)",
            "FINAL_MSI_SIZE=$($msi.Length)",
            "FINAL_MSI_SHA256=$sha",
            "OMNIRIG_SOURCE_BUILD_AUDIT=PASS",
            "OMNIRIG_COM64=PASS",
            "TCI_BANDSAFE_RETENTION_AUDIT=PASS",
            "OMNIRIG_RUNTIME_REQUIRED=OmniRig 1.20 or compatible v1 COM server"
          ) | Set-Content "$env:FINAL_ROOT\OUTPUT\OMNIRIG_BUILD_INFO.txt" -Encoding UTF8
          Write-Host "FINAL_MSI=$($msi.Name)"
          Write-Host "FINAL_MSI_SIZE=$($msi.Length)"
          Write-Host "FINAL_MSI_SHA256=$sha"

      - name: Upload OmniRig artifact
        uses: actions/upload-artifact@v4
        with:
          name: JTDX-SuperHound-FINAL-TCI-BANDSAFE-OMNIRIG
          path: |
            ${{ env.FINAL_ROOT }}\OUTPUT\JTDX-SuperHound-2.2.159-FINAL-TCI-BANDSAFE-OMNIRIG-win64.msi
            ${{ env.FINAL_ROOT }}\OUTPUT\OMNIRIG_BUILD_INFO.txt
            ${{ env.FINAL_ROOT }}\LOGS\*.log
          if-no-files-found: error
