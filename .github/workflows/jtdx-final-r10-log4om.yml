name: JTDX R10 SLICEMASTER FLEX LOG4OM TEST

on:
  push:
    branches:
      - test/r10-log4om
    paths:
      - '.github/workflows/jtdx-final-r10-log4om.yml'
      - 'jtdx-final/apply_final_tci_omnirig_r10_log4om_overlay.py'
      - 'jtdx-final/patch_log4om_cmake_r10.py'
      - 'jtdx-final/patch_log4om_logbook_r10.py'
      - 'jtdx-final/patch_log4om_config_r10.py'
      - 'jtdx-final/patch_log4om_mainwindow_r10.py'
      - 'jtdx-final/patch_log4om_postcheck_r10.py'
      - 'jtdx-final/apply_final_tci_omnirig_r9_slicemaster_flex_overlay.py'
      - 'jtdx-final/apply_final_tci_omnirig_r8_flex6xxx_overlay.py'
      - 'jtdx-final/apply_final_tci_omnirig_r7_overlay.py'
      - 'jtdx-final/apply_final_tci_omnirig_r6_overlay.py'
      - 'jtdx-final/apply_final_tci_omnirig_r5_overlay.py'
      - 'jtdx-final/apply_final_tci_omnirig_r4_overlay.py'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct verified FINAL-TCI baseline
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = Get-ChildItem '.\jtdx-final\package.b64.*' | Sort-Object Name
          if ($parts.Count -ne 11) { throw "Expected 11 package segments, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          $zip = Join-Path $env:RUNNER_TEMP 'JTDX_FINAL_BUILD_INPUT.zip'
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = '0412ed99483ca876166dd95983dc65f69eb364521596c2429e8d32e0a4cf9a5d'
          Write-Host "INPUT_SHA256=$actual"
          if ($actual -ne $expected) { throw "Build input SHA256 mismatch: $actual" }
          $dst = Join-Path $env:RUNNER_TEMP 'JTDX_FINAL_BUILD'
          if (Test-Path $dst) { Remove-Item -Recurse -Force $dst }
          Expand-Archive -Path $zip -DestinationPath $dst -Force
          "FINAL_ROOT=$dst" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Apply R10 Log4OM overlay
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $overlay = "$env:GITHUB_WORKSPACE\jtdx-final\apply_final_tci_omnirig_r10_log4om_overlay.py"
          python $overlay "$env:FINAL_ROOT"
          python -m py_compile $overlay
          Get-ChildItem "$env:GITHUB_WORKSPACE\jtdx-final\patch_log4om_*_r10.py" | ForEach-Object { python -m py_compile $_.FullName }
          python -m py_compile "$env:FINAL_ROOT\patch_superhound.py"

          $patcher = "$env:FINAL_ROOT\patch_superhound.py"
          $builder = "$env:FINAL_ROOT\BUILD_JTDX_SUPERHOUND_MSI.ps1"
          foreach ($needle in @(
            'QSQLITE_OPEN_READONLY',
            'PRAGMA query_only = ON',
            'ADIF _workedLog;',
            'Use Log4OM SQLite database for Worked/New',
            'log4omWatcher',
            'JTDX_QSQLITE_DLL',
            'return _log.getCount(mod);'
          )) {
            if (-not (Select-String -Path $patcher -SimpleMatch $needle -Quiet)) { throw "R10 patch gate missing: $needle" }
          }
          foreach ($needle in @(
            "MSI_VERSION='2.2.207'",
            "MSI_NAME='JTDX-SuperHound-2.2.159-R10-SLICEMASTER-FLEX-LOG4OM-TEST-win64'",
            '8cd24f3d935c740d2c3c901ae3af786964cfdd05101d47c913073aaa24f412da',
            'R9 exact official JTDX 2.2.159 Hamlib runtime installed'
          )) {
            if (-not (Select-String -Path $builder -SimpleMatch $needle -Quiet)) { throw "R10 builder gate missing: $needle" }
          }
          if (Select-String -Path $patcher -SimpleMatch 'qsqlibase.dll' -Quiet) { throw 'Forbidden qsqlibase.dll reference in R10 patch' }
          if (Select-String -Path $patcher -SimpleMatch 'fbclient.dll' -Quiet) { throw 'Forbidden fbclient.dll reference in R10 patch' }
          Write-Host 'R10_LOG4OM_STATIC_CHECK=PASS'

      - name: Fix pinned SuperFox dependency import
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $builder = Join-Path $env:FINAL_ROOT 'BUILD_JTDX_SUPERHOUND_MSI.ps1'
          $fix = Join-Path $env:RUNNER_TEMP 'fix_superfox_import.py'
          @'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text(encoding='utf-8')
          old = '''rm -rf jtdx/lib/superfox
          cp -a "$WSJTX_CACHE/lib/superfox" jtdx/lib/superfox
          test -s jtdx/lib/superfox/smo121.f90
          echo "[PASS] SuperFox source pinned at $WSJTX_REF"'''
          new = '''rm -rf jtdx/lib/superfox
          cp -a "$WSJTX_CACHE/lib/superfox" jtdx/lib/superfox
          test -s "$WSJTX_CACHE/lib/smo121.f90"
          cp -f "$WSJTX_CACHE/lib/smo121.f90" jtdx/lib/superfox/smo121.f90
          test -s jtdx/lib/superfox/smo121.f90
          echo "[PASS] SuperFox source + smo121 dependency pinned at $WSJTX_REF"'''
          if old not in s:
              raise SystemExit('[FAIL] SuperFox import anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8', newline='\n')
          print('[PASS] SuperFox smo121 import corrected')
          '@ | Set-Content -Path $fix -Encoding UTF8
          python $fix $builder

      - name: Install official OmniRig runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'OmniRig-1.20.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'OmniRig-1.20'
          Invoke-WebRequest -UseBasicParsing -Uri 'https://www.dxatlas.com/OmniRig/Files/OmniRig.zip' -OutFile $zip
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($sha -ne '46654EC3BA2FE9FF23A21EDAA657C46E0E9867B62B254968A3C4436DD81531A8') { throw 'Official OmniRig 1.20 package SHA-256 mismatch' }
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $setup = Join-Path $dir 'OmniRigSetup.exe'
          if (-not (Test-Path $setup)) { throw 'OmniRigSetup.exe missing' }
          $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "OmniRig installer exit code $($p.ExitCode)" }
          Write-Host 'OMNIRIG_RUNTIME_INSTALL=PASS'

      - name: Setup MSYS2 MINGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          location: C:\msys64
          update: true
          cache: false
          install: >-
            git
            make
            patch
            pkgconf
            autoconf
            automake
            libtool
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-fortran
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-activeqt
            mingw-w64-x86_64-qt5-multimedia
            mingw-w64-x86_64-qt5-serialport
            mingw-w64-x86_64-qt5-tools
            mingw-w64-x86_64-qt5-websockets

      - name: Cache pinned JTDX Hamlib build
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\_JTDX_SUPERHOUND_CACHE\hamlib-prefix
          key: jtdx159-hamlib-1e70dd7b98fd715c829724313eb88884ca1cbfc1-windows2022-v1

      - name: Verify OmniRig COM through Qt dumpcpp
        shell: msys2 {0}
        run: |
          set -e
          export PATH="/mingw64/bin:/usr/bin:$PATH"
          DUMPCPP="$(command -v dumpcpp-qt5 || command -v dumpcpp)"
          test -n "$DUMPCPP"
          AXSERVER="$("$DUMPCPP" -getfile {4FE359C5-A58F-459D-BE95-CA559FB4F270} | tr -d '\r')"
          test -n "$AXSERVER"
          echo "OMNIRIG_AXSERVER=$AXSERVER"
          echo 'OMNIRIG_DUMPCPP_DISCOVERY=PASS'

      - name: Build MSI
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:FINAL_ROOT\BUILD_JTDX_SUPERHOUND_MSI.ps1"

      - name: Verify MSI and Log4OM runtime
        if: success()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = @(Get-ChildItem "$env:FINAL_ROOT\OUTPUT" -Filter '*.msi' -File -Recurse)
          if ($msi.Count -ne 1) { throw "Expected exactly one MSI, found $($msi.Count)" }
          if ($msi[0].Length -lt 1MB) { throw 'MSI unexpectedly small' }
          $sha = (Get-FileHash $msi[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "FINAL_MSI=$($msi[0].Name)"
          Write-Host "FINAL_MSI_SIZE=$($msi[0].Length)"
          Write-Host "FINAL_MSI_SHA256=$sha"

          $extract = Join-Path $env:RUNNER_TEMP 'R10_MSI_EXTRACT'
          if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          $args = @('/a', $msi[0].FullName, '/qn', "TARGETDIR=$extract")
          $p = Start-Process -FilePath msiexec.exe -ArgumentList $args -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "MSI administrative extraction failed: $($p.ExitCode)" }

          $sqlite = @(Get-ChildItem $extract -Recurse -File -Filter 'qsqlite.dll')
          if ($sqlite.Count -ne 1) { throw "Expected exactly one qsqlite.dll in MSI, found $($sqlite.Count)" }
          $badIbase = @(Get-ChildItem $extract -Recurse -File -Filter 'qsqlibase.dll')
          $badFb = @(Get-ChildItem $extract -Recurse -File -Filter 'fbclient.dll')
          if ($badIbase.Count -ne 0) { throw 'qsqlibase.dll must not be packaged' }
          if ($badFb.Count -ne 0) { throw 'fbclient.dll must not be packaged' }
          Write-Host "QSQLITE_RUNTIME=$($sqlite[0].FullName)"
          Write-Host 'R10_LOG4OM_MSI_RUNTIME_CHECK=PASS'

      - name: Upload MSI and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JTDX-R10-SLICEMASTER-FLEX-LOG4OM-TEST
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ env.FINAL_ROOT }}/OUTPUT/**
            ${{ env.FINAL_ROOT }}/LOGS/**
